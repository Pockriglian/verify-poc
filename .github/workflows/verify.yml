name: poc-secret-access
on:
  push:
    branches: [main]
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: show that merged code holds the repository secret
        env:
          S: ${{ secrets.CI_CANARY }}
        run: |
          echo "secret readable: ${S:+yes}"
          echo "secret length: ${#S}"
